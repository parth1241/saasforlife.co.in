<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Square matching deep theme -->
  <rect width="512" height="512" rx="128" fill="#0F172A" stroke="#1E293B" stroke-width="12" />
  
  <!-- Stylized "S" shape curve representing SaaS and Life -->
  <path d="M 170 170 
           C 170 120, 342 120, 342 200 
           C 342 270, 170 242, 170 312 
           C 170 392, 342 392, 342 342" 
        fill="none" 
        stroke="url(#logo-grad)" 
        stroke-width="56" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
</svg>
